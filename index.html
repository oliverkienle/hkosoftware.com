<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HKO Software · Yapım aşamasında</title>
<meta name="description" content="HKO Software web sitesi yapım aşamasında. Çok yakında yayındayız.">
<meta name="theme-color" content="#101116">
<link rel="icon" href="/favicon.png" type="image/png">
<style>
  :root { color-scheme: dark; --bg: #101116; --text: #f2f1ed; --muted: #a9adb8; --blue: #3a6cf4; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 16px;
    text-align: center;
  }
  main { width: 100%; max-width: 560px; }
  .logo { display: block; width: min(86vw, 520px); height: auto; margin: 0 auto; }
  h1 { margin: 8px 0 10px; font-size: clamp(20px, 5.2vw, 28px); font-weight: 600; letter-spacing: .01em; line-height: 1.35; }
  p { margin: 0; color: var(--muted); font-size: clamp(15px, 4vw, 17px); line-height: 1.6; }
  .bar { width: 56px; height: 3px; border-radius: 3px; background: var(--blue); margin: 26px auto 22px; }
</style>
</head>
<body>
<main>
  <img class="logo" src="/logo.png" width="1040" height="520" alt="HKO Software">
  <div class="bar" aria-hidden="true"></div>
  <h1>Sitemiz yapım aşamasında</h1>
  <p>Çok yakında yayındayız.</p>
</main>
</body>
</html>
